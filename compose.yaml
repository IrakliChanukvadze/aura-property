services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_local_only
      POSTGRES_DB: aura
    ports:
      - "5434:5432"
    volumes:
      - aura_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aura_postgres:
